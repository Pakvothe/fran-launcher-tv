plugins { id 'com.android.application' }

android {
    namespace 'pakvothe.franlauncher.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'pakvothe.franlauncher.tv'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1'
        // -PhomeEnabled=true prende el alias HOME; -PbenchExtras=true acepta los extras fl.* de bench.sh.
        manifestPlaceholders = [homeEnabled: project.findProperty('homeEnabled') ?: 'false',
                                benchExtras: project.findProperty('benchExtras') ?: 'false']
    }

    // La clave de release vive fuera del repo: ~/.config/fran-launcher/signing.properties
    // (storeFile, storePassword, keyAlias, keyPassword). Sin ese archivo, el release se firma con la de debug.
    def signingFile = new File(System.getProperty('user.home'), '.config/fran-launcher/signing.properties')
    signingConfigs {
        if (signingFile.exists()) {
            def p = new Properties()
            signingFile.withInputStream { p.load(it) }
            release {
                storeFile new File(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig false
        resValues false
    }

    // La fuente se mapea directo desde el APK: sin comprimir, ahorra la descompresión en el arranque.
    androidResources { noCompress 'ttf' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
